# Builds and deploys the Cloudflare Worker.
#
# This exists because the Worker bundle cannot be produced reliably on every
# developer machine: OpenNext needs directory symlinks (Windows needs Developer
# Mode for those) and a `workerd` binary it can execute. Ubuntu has both, and it
# is the platform OpenNext is developed against.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN   - Workers Scripts:Edit + Workers KV/R2 as needed
#   CLOUDFLARE_ACCOUNT_ID  - the account that owns the Worker
#
# Runtime variables (DATABASE_URL, FIREBASE_SERVICE_ACCOUNT_KEY, PUSHER_*,
# S3_*/AWS_*, SCHOOL_TIMEZONE) are Worker secrets, not build inputs — set them
# once with `npx wrangler secret put NAME`. Only `NEXT_PUBLIC_*` values are
# baked in at build time, so they belong here as build environment variables.
#
# Migrations are deliberately not run here: `npm run db:deploy` is a separate,
# reviewable step. Set RUN_MIGRATIONS=true to include it.

name: Deploy to Cloudflare Workers

on:
  workflow_dispatch:
    inputs:
      run_migrations:
        description: Apply pending Prisma migrations before deploying
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "src/**"
      - "prisma/**"
      - "public/**"
      - "next.config.ts"
      - "open-next.config.ts"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-workers.yml"

concurrency:
  group: deploy-workers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Migrate database
        if: ${{ inputs.run_migrations }}
        run: npm run db:deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Build for Workers
        run: npx opennextjs-cloudflare build
        env:
          # Inlined into the client bundle; everything else stays a runtime secret.
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_PUSHER_KEY: ${{ vars.NEXT_PUBLIC_PUSHER_KEY }}
          NEXT_PUBLIC_PUSHER_CLUSTER: ${{ vars.NEXT_PUBLIC_PUSHER_CLUSTER }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}

      - name: Deploy
        run: npx opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
