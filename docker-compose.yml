# Local PostgreSQL for development.
#
#   docker compose up -d
#
# Then set both of these in .env:
#   DATABASE_URL="postgresql://postgres:postgres@127.0.0.1:5432/lms_core"
#   DIRECT_URL="postgresql://postgres:postgres@127.0.0.1:5432/lms_core"

services:
  postgres:
    image: postgres:17-alpine
    container_name: lms-core-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lms_core
    ports:
      - "5432:5432"
    volumes:
      - lms-core-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lms_core"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lms-core-data:
